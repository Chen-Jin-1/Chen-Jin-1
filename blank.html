<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <link rel="stylesheet" href="assets/jx.css">
        <link rel="shortcut icon" href="https://m.ccw.site/user_projects_assets/b220bd61-4e94-4f08-a96a-f65f8326f68a.png">
        <title>Blank 的网站</title>
        <base target="_blank">
        <style>
            body {
                font-size: 42px;
                font-weight: 300;
                letter-spacing: 4px;
                text-shadow: 0 2px 15px var(--glow-color);
                user-select: none;
            }
            
            #bio {
                color: var(--text-secondary);
                font-size: 16px;
                font-weight: 400;
                letter-spacing: 3px;
                margin: 16px 0 40px 0;
                position: relative;
                text-transform: uppercase;
            }
            
            #bio::before,
            #bio::after {
                content: "◆";
                color: var(--accent-primary);
                margin: 0 12px;
                font-size: 12px;
                opacity: 0.6;
            }
            
            .button-container {
                display: flex;
                flex-direction: column;
                gap: 16px;
                width: 100%;
                max-width: 300px;
            }
            
            .title {
                animation: fadeIn 0.8s ease-out forwards;
                margin-top: auto;
                display: flex;
                align-items: center;
            }
            
            #bio {
                animation: fadeIn 0.8s ease-out forwards;
                animation-delay: 0.2s;
                opacity: 0;
            }
            
            .button-container {
                animation: fadeIn 0.8s ease-out forwards;
                animation-delay: 0.4s;
                opacity: 0;
            }

            .btn img {
                border-radius: 2px;
            }
            
            @media (max-width: 640px) {
                body {
                    font-size: 36px;
                    letter-spacing: 3px;
                }
                
                #bio {
                    font-size: 14px;
                    letter-spacing: 2px;
                }
                
                #bio::before,
                #bio::after {
                    margin: 0 8px;
                    font-size: 10px;
                }
                
                .button-container {
                    max-width: 280px;
                    gap: 14px;
                }
            }
            
            @media (max-width: 480px) {
                body {
                    font-size: 28px;
                    letter-spacing: 2px;
                }
                
                #bio {
                    font-size: 12px;
                    margin: 12px 0 32px 0;
                }
                
                .button-container {
                    max-width: 240px;
                    gap: 12px;
                }
            }

            .link {
                padding: 8px 20px;
                font-size: 14px;
            }

            .bottom {
                margin: auto auto 0 0;
                padding-left: 30px;
                display: flex;
                flex-direction: row;
            }

            .bottom > * {
                margin-right: 10px;
            }

            .avatar {
                width: 50px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
            }
        </style>
    </head>
    <body class="flex-center flex-col">
        <div class="title">
            <img src="https://m.ccw.site/user_projects_assets/b220bd61-4e94-4f08-a96a-f65f8326f68a.png" class="avatar">
            <span>[Blank]</span>
        </div>
        <div id="bio">糜鹿成群，虎豹避之；飞鸟成列，鹰鹫不击</div>
        <div class="button-container">
            <a href="https://www.ccw.site/student/692aaebc86bbc77f84e3bdb0" class="btn next">
                <img src="https://m.ccw.site/community/images/logo-ccw.png">
                CCW: [Blank]
            </a>
            
            <a href="https://qm.qq.com/q/SyLlei5qAC" class="btn">
                <img src="https://static-res.qq.com/static-res/imqq/qq-logo.png">
                QQ: 3475056621
            </a>

            <a href="https://github.com/Chen-Jin-z" class="btn">
                <img src="https://github.com/fluidicon.png">
                GitHub: Chen-Jin-z
            </a>

            <a href="mailto:z@chen-jin.dpdns.org" class="btn" style="font-size: 13px;">
                <img src="/Chen-Jin.png">
                Email: z@chen-jin.dpdns.org
            </a>
        </div>
        <div class="bottom">
            <a href="/" class="btn link" target="_self">
                <img src="/Chen-Jin.png">
                Chen-Jin 的主页
            </a>
        </div>
    </body>
</html>
