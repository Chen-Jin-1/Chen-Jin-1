<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <link rel="stylesheet" href="assets/jx.css">
        <link rel="icon" href="/favicon.ico">
        <title>Chen-Jin 的网站</title>
        <base target="_blank">
        <style>
            body {
                font-size: 42px;
                font-weight: 300;
                letter-spacing: 4px;
                text-shadow: 0 2px 15px var(--glow-color);
                user-select: none;
            }
            
            #bio {
                color: var(--text-secondary);
                font-size: 16px;
                font-weight: 400;
                letter-spacing: 3px;
                margin: 16px 0 40px 0;
                position: relative;
                text-transform: uppercase;
            }
            
            #bio::before,
            #bio::after {
                content: "◆";
                color: var(--accent-primary);
                margin: 0 12px;
                font-size: 12px;
                opacity: 0.6;
            }
            
            .button-container {
                display: flex;
                flex-direction: column;
                gap: 16px;
                width: 100%;
                max-width: 300px;
            }
            
            .title {
                animation: fadeIn 0.8s ease-out forwards;
                margin-top: auto;
                display: flex;
                align-items: center;
            }
            
            #bio {
                animation: fadeIn 0.8s ease-out forwards;
                animation-delay: 0.2s;
                opacity: 0;
            }
            
            .button-container {
                animation: fadeIn 0.8s ease-out forwards;
                animation-delay: 0.4s;
                opacity: 0;
            }

            .btn img {
                border-radius: 2px;
            }
            
            @media (max-width: 640px) {
                body {
                    font-size: 36px;
                    letter-spacing: 3px;
                }
                
                #bio {
                    font-size: 14px;
                    letter-spacing: 2px;
                }
                
                #bio::before,
                #bio::after {
                    margin: 0 8px;
                    font-size: 10px;
                }
                
                .button-container {
                    max-width: 280px;
                    gap: 14px;
                }
            }
            
            @media (max-width: 480px) {
                body {
                    font-size: 28px;
                    letter-spacing: 2px;
                }
                
                #bio {
                    font-size: 12px;
                    margin: 12px 0 32px 0;
                }
                
                .button-container {
                    max-width: 240px;
                    gap: 12px;
                }
            }

            .link {
                padding: 8px 20px;
                font-size: 14px;
            }

            .bottom {
                margin: auto auto 0 0;
                padding-left: 30px;
                display: flex;
                flex-direction: row;
            }

            .bottom > * {
                margin-right: 10px;
            }

            .avatar {
                width: 50px;
                height: 50px;
                border-radius: 10px;
                margin-right: 20px;
            }
        </style>
    </head>
    <body class="flex-center flex-col">
        <div class="title">
            <img src="https://m.ccw.site/works-covers/Chen-Jin-1.png" class="avatar">
            <span>Chen-Jin</span>
        </div>
        <div id="bio">高山仰止，景行行止</div>
        <div class="button-container">
            <a href="https://www.ccw.site/student/692538ef86bbc77f84e3b259" class="btn next">
                <img src="https://m.ccw.site/community/images/logo-ccw.png">
                CCW: Chen-Jin
            </a>

            <a href="https://qm.qq.com/q/EHthYHXZqE" class="btn">
                <img src="https://static-res.qq.com/static-res/imqq/qq-logo.png">
                QQ: 1513746258
            </a>

            <a href="https://space.bilibili.com/3546376847756055" class="btn">
                <img src="https://www.bilibili.com/favicon.ico">
                BiliBili: Chen-Jin-1
            </a>

            <a href="https://github.com/Chen-Jin-1" class="btn">
                <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/github/default.svg" style="background: #fff; border-radius: 50%; border: 1px solid white;">
                GitHub: Chen-Jin-1
            </a>

            <a href="mailto:cj3663@outlook.com" class="btn" style="font-size: 13px;">
                <img src="https://res.public.onecdn.static.microsoft/assets/mail/pwa/v4/pngs/apple-touch-icon.png">
                Email: cj3663@outlook.com
            </a>
        </div>
        <div class="bottom">
            <a href="blank.html" class="btn link" target="_self">
                <img src="//d.chen-jin.dpdns.org/avatar/blank.png">
                [Blank] 的主页
            </a>
            <a href="friends.html" class="btn link" target="_self">
                友情链接
            </a>
        </div>
    </body>
</html>
